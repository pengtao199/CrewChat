[project]
name = "crewchat"
# PEP 440 形式的后端版本，与 src/crewchat/core/version.py 的 v1 递增体系一致。
version = "1.0.0"
description = "多 Agent 协作桌面应用：crewai 编排后端 + AionUi 外壳 + cc-switch 网关"
readme = "README.md"
authors = [
    { name = "pengtao", email = "pengtao2048@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.164",
    "crewai>=1.15.25",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai-codex-sdk>=0.1.11",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]


[project.scripts]
crewchat = "crewchat.api.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
