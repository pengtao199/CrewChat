[project]
name = "crewchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pengtao", email = "pengtao2048@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.164",
    "crewai>=1.15.25",
    "fastapi>=0.143.0",
    "openai-codex-sdk>=0.1.11",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]


[project.scripts]
crewchat = "crewchat.api.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
