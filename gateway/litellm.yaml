model_list:
  # OpenAI 兼容上游（如 agnes-ai）。LiteLLM 负责把各家的线格式统一：
  #   /v1/chat/completions  → opencode、我们的 llm 身体
  #   /v1/responses          → codex（0.161 只支持这个）
  #   /v1/messages           → claude code
  - model_name: agnes-2.5-flash
    litellm_params:
      model: openai/agnes-2.5-flash
      api_base: os.environ/AGNES_BASE_URL
      api_key: os.environ/AGNES_API_KEY
      drop_params: true

  - model_name: agnes-2.5-pro
    litellm_params:
      model: openai/agnes-2.5-pro
      api_base: os.environ/AGNES_BASE_URL
      api_key: os.environ/AGNES_API_KEY
      drop_params: true

  - model_name: agnes-3.0-flash
    litellm_params:
      model: openai/agnes-3.0-flash
      api_base: os.environ/AGNES_BASE_URL
      api_key: os.environ/AGNES_API_KEY
      drop_params: true

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  disable_spend_logs: true
  # 只监听 127.0.0.1，本机自用；需要对外暴露时改为设 master key
  dangerously_permit_weak_or_unset_master_key: true