[package]
name = "crewchat-mcp"
version = "0.1.0"
edition = "2021"
description = "CrewChat MCP layer: registry, per-Agent gateway access, and session config"
license = "MIT"

[[bin]]
name = "crewchat-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
hex = "0.4"
mcp-proxy = { version = "0.6", default-features = false }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
toml = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
